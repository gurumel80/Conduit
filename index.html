  #ov h1{font-family:'Orbitron',monospace;font-size:36px;font-weight:900;color:var(--c);
    text-shadow:0 0 25px var(--c),0 0 50px rgba(0,180,160,0.25);letter-spacing:10px;animation:flk 4s infinite;}
  .sub{font-size:10px;letter-spacing:5px;opacity:0.45;color:var(--m);}
  .btn{margin-top:8px;padding:10px 32px;background:transparent;border:1px solid var(--c);

    cursor:pointer;transition:all .2s;text-transform:uppercase;}
  .btn:hover{background:var(--c);color:var(--bg);box-shadow:0 0 20px var(--c);}
  #df{position:absolute;top:0;left:0;right:0;bottom:120px;background:rgba(160,18,30,0.5);
    pointer-events:none;z-index:9;display:none;}
  #mm{position:absolute;top:8px;right:8px;z-index:6;border:1px solid #0a2818;opacity:0.88;}
  @keyframes flk{0%,94%,100%{opacity:1}95%{opacity:.3}96%{opacity:.9}97%{opacity:.1}98%{opacity:.8}}
  /* Mobile controls */
  #mctrl{position:absolute;top:0;left:0;right:0;bottom:120px;z-index:15;pointer-events:none;}

  #look-indicator{position:absolute;width:56px;height:56px;border-radius:50%;

    pointer-events:none;transform:translate(-50%,-50%);opacity:0;transition:opacity .15s;}
  #look-indicator.active{opacity:1;}
</style>

<body>
<div id="wrap">
  <canvas id="cv" width="800" height="400"></canvas>
  <div id="df"></div>
  <canvas id="mm" width="160" height="160"></canvas>
  <div id="hud">
    <div><div class="hl">lives</div><div id="ld">
      <span class="li on" id="l1">◈</span>
      <span class="li on" id="l2">◈</span>
      <span class="li on" id="l3">◈</span>
    </div></div>
    <div><div class="hl">keycards</div><div id="kds">
      <div class="kc r" id="cr">RED</div>
      <div class="kc g" id="cg">GRN</div>
      <div class="kc b" id="cb">BLU</div>
    </div></div>
    <div><div class="hl">controls</div><div class="ch">W/S MOVE &nbsp; A/D TURN &nbsp; E DOOR<br>TOUCH: DRAG LOOK &nbsp; TAP FWD/DOOR</div></div>

    <h1>CONDUIT</h1>

    <div style="font-size:9px;letter-spacing:2px;opacity:0.38;margin-top:8px;line-height:2.4;text-align:center">
      COLLECT THREE KEYCARDS &nbsp;·&nbsp; EVADE SECURITY UNITS<br>
      UNITS SHOOT TO KILL &nbsp;·&nbsp; BULLETS CAN BE DODGED<br>
      KEYCARDS KEPT ON DEATH &nbsp;·&nbsp; 3 LIVES
    </div>
    <button class="btn" id="startbtn">ENTER SECTOR</button>
  </div>

<script>
// ══════════════════════════════════════════════════════════════
//  LABYRINTH v2 — SECTOR ZERO
// ══════════════════════════════════════════════════════════════
const CV=document.getElementById('cv'),CX=CV.getContext('2d');
const MM=document.getElementById('mm'),MX=MM.getContext('2d');
const W=800,H=400,TILE=64;
const FOV=Math.PI/3,HFOV=FOV/2;
const RAYS=240,RAY_STEP=FOV/RAYS,COL_W=W/RAYS;
const MAXD=950,MSPD=1.6,RSPD=0.036,PRAD=14;

// Cell types
const MT=0,WL=1,DR=2,DG=3,DB=4,KR=5,KG=6,KB=7,EX=8;

// Wall colour palettes — 3 zones matching door colours (muted CMYK)
// Zone 0 = red section, Zone 1 = green section, Zone 2 = blue section, Zone 3 = beyond
const ZONE_COLS=[
  [90,22,32],   // red zone — muted claret
  [18,75,38],   // green zone — muted viridian
  [20,45,105],  // blue zone — muted cobalt
  [55,55,22],   // exit zone — muted gold
];
// Side-face shade factor
const SIDE_SHADE=0.52;

// Maze dimensions — large, multi-route
const MZW=29,MZH=23;
let maze=[],cellPal=[],explored=[];
let robots=[],bullets=[],doorStates={};
let player={x:0,y:0,angle:0};
let lives=3,keycards={r:false,g:false,b:false};
let dead=false,won=false,running=false;
let keys={},lastT=0,statusTimer=0;

// ── Maze generation ───────────────────────────────────────────
function genMaze(){
  maze=Array.from({length:MZH},()=>Array(MZW).fill(WL));
  cellPal=Array.from({length:MZH},()=>Array(MZW).fill(0));

  // Recursive backtracker
  function carve(x,y){
    maze[y][x]=MT;
    const dirs=[[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-.5);
    for(const [dx,dy] of dirs){
      const nx=x+dx,ny=y+dy;
      if(nx>0&&nx<MZW-1&&ny>0&&ny<MZH-1&&maze[ny][nx]===WL){
        maze[y+dy/2][x+dx/2]=MT;
        carve(nx,ny);
      }
    }
  }
  carve(1,1);

  // Extra loops for multiple routes
  for(let i=0;i<60;i++){
    const x=2+Math.floor(Math.random()*(MZW-4));
    const y=2+Math.floor(Math.random()*(MZH-4));
    if(maze[y][x]===WL){
      const en=[[1,0],[-1,0],[0,1],[0,-1]]
        .filter(([dx,dy])=>maze[y+dy]&&maze[y+dy][x+dx]===MT).length;
      if(en>=2) maze[y][x]=MT;
    }
  }

  // ── Place 3 doors dividing maze into zones ────────────────
  // Strategy: find corridor pinch-points, place at ~1/3 and ~2/3 depth,
  // then the blue (3rd) door is near the exit corner.
  const corridors=[];
  for(let y=2;y<MZH-2;y++) for(let x=2;x<MZW-2;x++){
    if(maze[y][x]!==MT) continue;
    const depth=x+y;
    const hC=maze[y][x-1]===MT&&maze[y][x+1]===MT&&maze[y-1][x]===WL&&maze[y+1][x]===WL;
    const vC=maze[y-1][x]===MT&&maze[y+1][x]===MT&&maze[y][x-1]===WL&&maze[y][x+1]===WL;
    if(hC||vC) corridors.push([x,y,depth]);
  }
  corridors.sort((a,b)=>a[2]-b[2]);

  const doorPos=[];
  const maxDepth=MZW+MZH-4;
  // Red door: ~30% depth
  // Green door: ~60% depth
  // Blue door: ~85% depth (near exit)
  const targets=[0.30,0.60,0.85];
  const doorT=[DR,DG,DB];
  for(let i=0;i<3;i++){
    const targetD=targets[i]*maxDepth;
    let best=null,bestDist=99999;
    for(const [cx,cy,depth] of corridors){
      if(Math.abs(cx-1)+Math.abs(cy-1)<6) continue;
      // Don't overlap other doors
      if(doorPos.some(([px,py])=>Math.abs(px-cx)+Math.abs(py-cy)<4)) continue;
      const d=Math.abs(depth-targetD);
      if(d<bestDist){bestDist=d;best=[cx,cy];}
    }
    if(best){
      maze[best[1]][best[0]]=doorT[i];
      doorPos.push(best);
    }
  }

  // Exit: just beyond blue door in the far region
  // Find an empty cell with depth > blue door depth
  const [bdx,bdy]=doorPos[2]||[MZW-3,MZH-3];
  const exitPool=[];
  for(let y=1;y<MZH-1;y++) for(let x=1;x<MZW-1;x++){
    if(maze[y][x]===MT&&(x+y)>(bdx+bdy)&&Math.abs(x-bdx)+Math.abs(y-bdy)>2) exitPool.push([x,y]);
  }
  exitPool.sort((a,b)=>(b[0]+b[1])-(a[0]+a[1])); // furthest first
  if(exitPool.length) maze[exitPool[0][1]][exitPool[0][0]]=EX;
  else maze[MZH-2][MZW-2]=EX;

  // ── Zone flood-fill from start, respecting door barriers ──
  // Zone 0 = before red door, 1 = red→green, 2 = green→blue, 3 = blue→exit
  const zone=Array.from({length:MZH},()=>Array(MZW).fill(-1));
  function floodZone(startX,startY,zoneId,barriers){
    const q=[[startX,startY]];
    zone[startY][startX]=zoneId;
    while(q.length){
      const [cx,cy]=q.shift();
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=cx+dx,ny=cy+dy;
        if(nx<0||nx>=MZW||ny<0||ny>=MZH) continue;
        if(zone[ny][nx]>=0) continue;
        const c=maze[ny][nx];
        if(c===WL) continue;
        if(barriers.includes(c)) continue; // stop at these door types
        zone[ny][nx]=zoneId;
        q.push([nx,ny]);
      }
    }
  }
  // Flood zone 0 from start, stops at all doors
  floodZone(1,1,0,[DR,DG,DB]);
  // Flood zone 1 from cells beyond red door
  const [rdx,rdy]=doorPos[0]||[0,0];
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=rdx+dx,ny=rdy+dy;
    if(nx>=0&&nx<MZW&&ny>=0&&ny<MZH&&zone[ny][nx]<0&&maze[ny][nx]!==WL){
      floodZone(nx,ny,1,[DG,DB]);
    }
  }
  // Flood zone 2 from beyond green door
  const [gdx,gdy]=doorPos[1]||[0,0];
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=gdx+dx,ny=gdy+dy;
    if(nx>=0&&nx<MZW&&ny>=0&&ny<MZH&&zone[ny][nx]<0&&maze[ny][nx]!==WL){
      floodZone(nx,ny,2,[DB]);
    }
  }
  // Flood zone 3 from beyond blue door
  const [bldx,bldy]=doorPos[2]||[0,0];
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=bldx+dx,ny=bldy+dy;
    if(nx>=0&&nx<MZW&&ny>=0&&ny<MZH&&zone[ny][nx]<0&&maze[ny][nx]!==WL){
      floodZone(nx,ny,3,[]);
    }
  }
  // Apply zones to cellPal; anything unzoned stays 0
  for(let y=0;y<MZH;y++) for(let x=0;x<MZW;x++){
    cellPal[y][x]=zone[y][x]>=0?zone[y][x]:0;
  }

  // ── Keycards: placed in correct zone AND as far from start as possible
  // Red card (opens red door) in zone 0, green card in zone 1, blue card in zone 2
  // Prefer cells far from start so player must explore
  const cardT=[KR,KG,KB];
  const cardZone=[0,1,2];
  for(let i=0;i<3;i++){
    let pool=[];
    for(let y=1;y<MZH-1;y++) for(let x=1;x<MZW-1;x++){
      if(maze[y][x]===MT&&zone[y][x]===cardZone[i]) pool.push([x,y,x+y]);
    }
    // Sort furthest from start first, pick from top 25% of pool
    pool.sort((a,b)=>b[2]-a[2]);
    const topN=Math.max(1,Math.floor(pool.length*0.25));
    pool=pool.slice(0,topN);
    if(pool.length){
      const pick=pool[Math.floor(Math.random()*pool.length)];
      maze[pick[1]][pick[0]]=cardT[i];
    }
  }

  // Robots: spread across zones 0-2, with fallback to any open cell if zone is empty
  robots=[];
  for(let i=0;i<3;i++){
    let pool=[];
    for(let y=2;y<MZH-2;y++) for(let x=2;x<MZW-2;x++){
      if(maze[y][x]===MT&&zone[y][x]===i&&Math.abs(x-1)+Math.abs(y-1)>6) pool.push([x,y]);
    }
    // Fallback: any open floor cell away from start
    if(!pool.length){
      for(let y=2;y<MZH-2;y++) for(let x=2;x<MZW-2;x++){
        if(maze[y][x]===MT&&Math.abs(x-1)+Math.abs(y-1)>8) pool.push([x,y]);
      }
    }
    pool.sort(()=>Math.random()-.5);
    // Place 2 robots per zone for zones 0-1, 1 for zone 2
    const count = i<2?2:1;
    for(let j=0;j<count&&j<pool.length;j++){
      const [rx,ry]=pool[j];
      // Check not overlapping another robot
      const wx=rx*TILE+TILE/2, wy=ry*TILE+TILE/2;
      if(robots.some(r=>Math.hypot(r.x-wx,r.y-wy)<TILE*2)) continue;
      robots.push({x:wx,y:wy,
        angle:Math.random()*Math.PI*2,wTimer:50+Math.random()*80,
        sTimer:80+Math.random()*80,alive:true,id:i});
    }
  }

  explored=Array.from({length:MZH},()=>Array(MZW).fill(false));
  bullets=[];
  doorStates={};
}

// ── Audio ─────────────────────────────────────────────────────
let AC,robotGain,robotLoopId=null;
function getAC(){ if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)(); return AC; }

// Robot sound: duhduhduh-DUN — three quick light beats, one heavy accent
// Fast, unsettling heartbeat rhythm
function startRobotAudio(){
  if(robotLoopId) return;
  const a=getAC();
  robotGain=a.createGain(); robotGain.gain.value=0;
  robotGain.connect(a.destination);
  schedulePattern();
}
function schedulePattern(){
  const a=AC; if(!a) return;
  const t=a.currentTime;
  const q=0.13; // quick beat interval
  // duh duh duh DUN — three light, one heavy, then silence
  mkBeat(t+0,    0.32, false); // duh
  mkBeat(t+q,    0.32, false); // duh
  mkBeat(t+q*2,  0.32, false); // duh
  mkBeat(t+q*3,  1.0,  true);  // DUN — heavy accent
  robotLoopId=setTimeout(schedulePattern,1100);
}
function mkBeat(t,vel,heavy){
  const a=AC; if(!a||!robotGain) return;
  // Tonal thud — gives it the "duh" pitch character
  const o=a.createOscillator(),og=a.createGain(),of_=a.createBiquadFilter();
  of_.type='lowpass'; of_.frequency.value=heavy?200:140; of_.Q.value=4;
  o.type='sine';
  o.frequency.setValueAtTime(heavy?72:58,t);
  o.frequency.exponentialRampToValueAtTime(heavy?30:24,t+(heavy?0.28:0.16));
  og.gain.setValueAtTime(0,t);
  og.gain.linearRampToValueAtTime(vel*(heavy?0.85:0.45),t+0.006);
  og.gain.exponentialRampToValueAtTime(0.001,t+(heavy?0.30:0.18));
  o.connect(of_);of_.connect(og);og.connect(robotGain);
  o.start(t);o.stop(t+(heavy?0.32:0.20));

  // Noise body
  const dur=heavy?0.14:0.08;
  const nb=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate);
  const nd=nb.getChannelData(0);
  const dec=a.sampleRate*(heavy?0.035:0.018);
  for(let i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1)*Math.exp(-i/dec);
  const ns=a.createBufferSource(),ng=a.createGain(),nf=a.createBiquadFilter();
  nf.type='bandpass'; nf.frequency.value=heavy?110:90; nf.Q.value=3;
  ns.buffer=nb;
  ng.gain.setValueAtTime(vel*(heavy?0.6:0.35),t);
  ng.gain.exponentialRampToValueAtTime(0.001,t+dur);
  ns.connect(nf);nf.connect(ng);ng.connect(robotGain);
  ns.start(t);ns.stop(t+dur+0.01);

  // Click transient
  const cb=a.createBuffer(1,Math.floor(a.sampleRate*0.012),a.sampleRate);
  const cd=cb.getChannelData(0);
  for(let i=0;i<cd.length;i++) cd[i]=(Math.random()*2-1)*Math.exp(-i/(a.sampleRate*0.003));
  const cs=a.createBufferSource(),cg=a.createGain(),cf=a.createBiquadFilter();
  cf.type='highpass'; cf.frequency.value=heavy?1500:2200;
  cs.buffer=cb;
  cg.gain.setValueAtTime(vel*(heavy?1.0:0.6),t);
  cg.gain.exponentialRampToValueAtTime(0.001,t+0.014);
  cs.connect(cf);cf.connect(cg);cg.connect(robotGain);
  cs.start(t);cs.stop(t+0.014);
}
function setRobotVol(minDist){
  if(!robotGain) return;
  const far=TILE*10,near=TILE*1.8;
  if(minDist>far){robotGain.gain.value=0;return;}
  const t=1-Math.min(1,Math.max(0,(minDist-near)/(far-near)));
  robotGain.gain.value=t*t*0.9;
}

function sndDoor(){
  const a=getAC(),n=a.currentTime;
  const o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();
  f.type='bandpass';f.frequency.value=160;f.Q.value=4;
  o.type='sawtooth';
  o.frequency.setValueAtTime(85,n);
  o.frequency.exponentialRampToValueAtTime(25,n+1.5);
  g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(0.5,n+0.1);
  g.gain.exponentialRampToValueAtTime(0.001,n+1.5);
  o.connect(f);f.connect(g);g.connect(a.destination);o.start(n);o.stop(n+1.6);
  const nb=a.createBuffer(1,Math.floor(a.sampleRate*0.22),a.sampleRate);
  const nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1)*Math.exp(-i/700);
  const ns=a.createBufferSource(),ng=a.createGain(),nf=a.createBiquadFilter();
  nf.type='highpass';nf.frequency.value=700;
  ng.gain.setValueAtTime(0.35,n);ng.gain.exponentialRampToValueAtTime(0.001,n+0.22);
  ns.buffer=nb;ns.connect(nf);nf.connect(ng);ng.connect(a.destination);ns.start(n);
}
function sndPickup(){
  const a=getAC(),n=a.currentTime;
  [440,660,880].forEach((freq,i)=>{
    const o=a.createOscillator(),g=a.createGain();
    o.type='square';o.frequency.value=freq;
    g.gain.setValueAtTime(0.1,n+i*.07);g.gain.exponentialRampToValueAtTime(0.001,n+i*.07+.14);
    o.connect(g);g.connect(a.destination);o.start(n+i*.07);o.stop(n+i*.07+.15);
  });
}
function sndShot(){
  const a=getAC(),n=a.currentTime;
  const o=a.createOscillator(),g=a.createGain();
  o.type='square';
  o.frequency.setValueAtTime(280,n);
  o.frequency.exponentialRampToValueAtTime(55,n+0.16);
  g.gain.setValueAtTime(0.15,n);g.gain.exponentialRampToValueAtTime(0.001,n+0.16);
  o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+0.18);
}
function sndDeath(){
  const a=getAC(),n=a.currentTime;
  const o=a.createOscillator(),g=a.createGain();
  o.type='sawtooth';
  o.frequency.setValueAtTime(260,n);o.frequency.exponentialRampToValueAtTime(16,n+2);
  g.gain.setValueAtTime(0.38,n);g.gain.exponentialRampToValueAtTime(0.001,n+2);
  o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+2.1);
}

// ── Collision helpers ─────────────────────────────────────────
function solid(wx,wy){
  const mx=Math.floor(wx/TILE),my=Math.floor(wy/TILE);
  if(mx<0||mx>=MZW||my<0||my>=MZH) return true;
  const c=maze[my][mx];
  if(c===WL) return true;
  if(c===DR||c===DG||c===DB){
    const k=`${mx},${my}`;
    return !doorStates[k]?.open;
  }
  return false;
}
function moveP(dx,dy){
  const r=PRAD;
  if(!solid(player.x+dx+r,player.y)&&!solid(player.x+dx-r,player.y)&&
     !solid(player.x+dx,player.y+r)&&!solid(player.x+dx,player.y-r)) player.x+=dx;
  if(!solid(player.x,player.y+dy+r)&&!solid(player.x,player.y+dy-r)&&
     !solid(player.x+r,player.y+dy)&&!solid(player.x-r,player.y+dy)) player.y+=dy;
}

// ── Raycaster ─────────────────────────────────────────────────
function castRay(angle){
  const ca=Math.cos(angle),sa=Math.sin(angle);
  for(let d=2;d<MAXD;d+=2){
    const rx=player.x+ca*d,ry=player.y+sa*d;
    const mx=Math.floor(rx/TILE),my=Math.floor(ry/TILE);
    if(mx<0||mx>=MZW||my<0||my>=MZH) return{d,t:WL,side:0,mx,my};
    const c=maze[my][mx];
    if(c===WL){
      const px=player.x+ca*(d-2),py=player.y+sa*(d-2);
      return{d,t:WL,side:Math.floor(px/TILE)!==mx?1:0,mx,my};
    }
    if(c===DR||c===DG||c===DB){
      const k=`${mx},${my}`;
      if(!doorStates[k]?.open){
        const px=player.x+ca*(d-2),py=player.y+sa*(d-2);
        return{d,t:c,side:Math.floor(px/TILE)!==mx?1:0,mx,my};
      }
    }
    if(c===EX) return{d,t:EX,side:0,mx,my};
  }
  return{d:MAXD,t:MT,side:0,mx:0,my:0};
}

function wallColor(type,mx,my,side,dist){
  const fog=Math.max(0,1-dist/(MAXD*1.1));
  let base;
  if(type===WL){
    const z=cellPal[my]?.[mx]??0;
    const p=ZONE_COLS[Math.min(z,ZONE_COLS.length-1)];
    base=[p[0],p[1],p[2]];
  } else if(type===DR) base=[220,35,55];   // vivid red door
  else if(type===DG) base=[35,210,80];    // vivid green door
  else if(type===DB) base=[35,80,240];    // vivid blue door
  else if(type===EX) base=[200,200,40];   // gold exit
  else base=[20,32,44];
  const sh=side?SIDE_SHADE:1;
  return`rgb(${Math.floor(base[0]*sh*fog)},${Math.floor(base[1]*sh*fog)},${Math.floor(base[2]*sh*fog)})`;
}

// ── Sprite utilities ──────────────────────────────────────────
function spriteXY(wx,wy){
  const dx=wx-player.x,dy=wy-player.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  let ang=Math.atan2(dy,dx)-player.angle;
  while(ang>Math.PI) ang-=Math.PI*2;
  while(ang<-Math.PI) ang+=Math.PI*2;
  if(Math.abs(ang)>HFOV*1.35) return null;
  const sx=(W/2)+Math.tan(ang)*(W/2)/Math.tan(HFOV);
  return{sx,dist,ang};  // ang returned so callers can cosine-correct distance
}

// ── Draw robots — tall sinister blocky figures ────────────────
function drawRobots(zb){
  const sorted=[...robots.filter(r=>r.alive)].sort((a,b)=>
    Math.hypot(b.x-player.x,b.y-player.y)-Math.hypot(a.x-player.x,a.y-player.y));

  for(const rb of sorted){
    const s=spriteXY(rb.x,rb.y);
    if(!s) continue;
    const{sx,dist,ang}=s;
    const col=Math.floor(sx/COL_W);
    if(col<0||col>=RAYS||zb[col]<dist) continue;
    const fog=Math.max(0,1-dist/(MAXD*0.85));
    if(fog<0.03) continue;

    // Cosine-correct the distance exactly as walls do: cd = dist * cos(ang)
    // Wall bottom on screen = (H + wallProjH) / 2, wallProjH = TILE*H / cd
    // Sprite feet must sit exactly on that line.
    const cd = dist * Math.cos(ang);
    const wallPH = (TILE * H) / cd;
    const floorY = Math.min(H - 1, (H + wallPH) / 2);
    const pH = Math.min(H * 2.0, wallPH * 1.5);
    const pW = pH * 0.45;
    const top = floorY - pH;
    const L = sx - pW / 2;

    // Palette: muted but readable — fog handled by globalAlpha, not colour multiplication
    const rPals=[
      {body:'rgb(65,95,48)',  dark:'rgb(36,54,26)',  eye:'rgb(120,210,45)'},   // sickly green
      {body:'rgb(88,44,105)', dark:'rgb(50,24,62)',  eye:'rgb(200,60,230)'},   // toxic purple
      {body:'rgb(42,72,105)', dark:'rgb(22,40,62)',  eye:'rgb(45,150,255)'},   // cold blue
    ];
    const P=rPals[rb.id%3];

    CX.save();
    // Alpha carries the fog — body colours stay constant so they're always readable
    CX.globalAlpha=Math.min(1, fog*1.4 + 0.12);

    const u=x=>L+pW*x;
    const v=y=>top+pH*y;

    // ── PROPORTIONS ──────────────────────────────────────────
    // Legs:   0.38 → 1.00  (62% of height — absurdly long)
    // Pelvis: 0.34 → 0.38
    // Torso:  0.18 → 0.34  (narrow, squat)
    // Head:   0.02 → 0.18  (wide, flat, sits right on shoulders)
    // Eyes:   0.07 → 0.14

    // === LEGS — long, thin, slightly separated ===
    CX.fillStyle=P.dark;
    CX.fillRect(u(0.10),v(0.38),pW*0.34,pH*0.58);
    CX.fillStyle=P.body;
    CX.fillRect(u(0.10),v(0.38),pW*0.34,pH*0.04);
    CX.fillStyle=P.dark;
    CX.fillRect(u(0.56),v(0.38),pW*0.34,pH*0.58);
    CX.fillStyle=P.body;
    CX.fillRect(u(0.56),v(0.38),pW*0.34,pH*0.04);
    CX.fillStyle=P.body;
    CX.fillRect(u(0.06),v(0.94),pW*0.40,pH*0.06);
    CX.fillRect(u(0.54),v(0.94),pW*0.40,pH*0.06);
    CX.fillStyle=P.dark;
    CX.fillRect(u(0.10),v(0.42),pW*0.06,pH*0.52);
    CX.fillRect(u(0.84),v(0.42),pW*0.06,pH*0.52);

    // === PELVIS ===
    CX.fillStyle=P.body;
    CX.fillRect(u(0.08),v(0.34),pW*0.84,pH*0.06);
    CX.fillStyle=P.dark;
    CX.fillRect(u(0.08),v(0.34),pW*0.84,pH*0.015);

    // === TORSO ===
    CX.fillStyle=P.body;
    CX.fillRect(u(0.18),v(0.18),pW*0.64,pH*0.17);
    CX.fillStyle=P.dark;
    CX.fillRect(u(0.18),v(0.18),pW*0.08,pH*0.17);
    CX.fillRect(u(0.74),v(0.18),pW*0.08,pH*0.17);
    CX.fillRect(u(0.26),v(0.24),pW*0.48,pH*0.008);
    CX.fillRect(u(0.26),v(0.30),pW*0.48,pH*0.008);
    CX.fillStyle=P.dark;
    CX.fillRect(u(0.82),v(0.21),pW*0.20,pH*0.08);
    CX.fillStyle=P.body;
    CX.fillRect(u(0.82),v(0.22),pW*0.18,pH*0.06);
    CX.fillStyle=P.dark;
    CX.fillRect(u(0.98),v(0.235),pW*0.10,pH*0.035);

    // === HEAD ===
    CX.fillStyle=P.body;
    CX.fillRect(u(0.08),v(0.02),pW*0.84,pH*0.17);
    CX.fillStyle=P.dark;
    CX.fillRect(u(0.08),v(0.02),pW*0.84,pH*0.03);
    CX.fillRect(u(0.08),v(0.02),pW*0.09,pH*0.17);
    CX.fillRect(u(0.83),v(0.02),pW*0.09,pH*0.17);

    // === EYES ===
    CX.fillStyle='rgb(2,2,2)';
    CX.fillRect(u(0.17),v(0.07),pW*0.66,pH*0.08);
    CX.fillStyle=P.eye;
    CX.fillRect(u(0.18),v(0.075),pW*0.27,pH*0.065);
    CX.fillRect(u(0.55),v(0.075),pW*0.27,pH*0.065);
    // Bright inner strip
    CX.fillStyle='rgba(255,255,255,0.25)';
    CX.fillRect(u(0.20),v(0.085),pW*0.23,pH*0.030);
    CX.fillRect(u(0.57),v(0.085),pW*0.23,pH*0.030);

    CX.restore();
  }
}

// ── Draw bullets — chunky visible blocks ──────────────────────
function drawBullets(zb){
  for(const b of bullets){
    const s=spriteXY(b.x,b.y);
    if(!s) continue;
    const{sx,dist}=s;
    const col=Math.floor(sx/COL_W);
    if(col<0||col>=RAYS) continue;
    if(zb[col]<dist-12) continue;
    const fog=Math.max(0.15,1-dist/(MAXD*0.35));
    // Bigger, more visible
    const bh=Math.max(8,Math.min(24,(TILE*H)/dist*0.14));
    const bw=bh*1.8;
    CX.save();
    CX.globalAlpha=Math.min(1,fog);
    // Muted yellow-orange block — visible but not neon
    CX.fillStyle=`rgb(${Math.floor(180*fog)},${Math.floor(120*fog)},${Math.floor(20*fog)})`;
    CX.fillRect(sx-bw/2,H/2-bh/2,bw,bh);
    CX.fillStyle=`rgba(220,160,40,${fog*0.35})`;
    CX.fillRect(sx-bw/3,H/2-bh/3,bw*0.66,bh*0.66);
    CX.restore();
  }
}

// ── Draw keycards ─────────────────────────────────────────────
function drawPickups(zb){
  for(let y=0;y<MZH;y++) for(let x=0;x<MZW;x++){
    const c=maze[y][x];
    if(c<KR||c>KB) continue;
    const s=spriteXY(x*TILE+TILE/2,y*TILE+TILE/2);
    if(!s) continue;
    const{sx,dist}=s;
    if(dist>MAXD*0.5) continue;
    const col=Math.floor(sx/COL_W);
    if(col<0||col>=RAYS||zb[col]<dist) continue;
    const fog=Math.max(0,1-dist/(MAXD*0.38));
    const ph=Math.max(10,Math.min(38,(TILE*H)/dist*0.3));
    const pw=ph*1.55;
    const bob=Math.sin(Date.now()/480)*2.5;
    const ty=H/2-ph/2+bob;
    const cc=c===KR?[130,22,36]:c===KG?[20,110,48]:[20,48,128];
    CX.save();
    CX.globalAlpha=Math.min(1,fog*1.1);
    CX.fillStyle=`rgb(${Math.floor(cc[0]*fog)},${Math.floor(cc[1]*fog)},${Math.floor(cc[2]*fog)})`;
    CX.fillRect(sx-pw/2,ty,pw,ph);
    // Lighter corner
    CX.fillStyle=`rgba(${cc[0]+50},${cc[1]+50},${cc[2]+50},${fog*0.4})`;
    CX.fillRect(sx-pw/2+2,ty+2,pw*0.28,ph*0.32);
    // Chip
    CX.fillStyle=`rgba(0,0,0,0.45)`;
    CX.fillRect(sx-pw*0.18,ty+ph*0.38,pw*0.36,ph*0.28);
    CX.restore();
  }
}

// ── Main render ───────────────────────────────────────────────
function render(){
  // Ceiling
  const sky=CX.createLinearGradient(0,0,0,H/2);
  sky.addColorStop(0,'#060e18'); sky.addColorStop(1,'#0c1a28');
  CX.fillStyle=sky; CX.fillRect(0,0,W,H/2);
  // Floor
  const fl=CX.createLinearGradient(0,H/2,0,H);
  fl.addColorStop(0,'#0a1420'); fl.addColorStop(1,'#060c14');
  CX.fillStyle=fl; CX.fillRect(0,H/2,W,H/2);
  // Subtle floor grid
  CX.strokeStyle='rgba(0,100,80,0.18)'; CX.lineWidth=0.5;
  for(let i=1;i<8;i++){
    const fy=H/2+(H/2)*(i/7);
    CX.beginPath();CX.moveTo(0,fy);CX.lineTo(W,fy);CX.stroke();
  }
  for(let i=-4;i<=4;i++){
    CX.beginPath();CX.moveTo(W/2,H/2);CX.lineTo(W/2+i*(W/4),H);CX.stroke();
  }

  // Walls + door colour bleed
  const zb=new Float32Array(RAYS);
  // Track where doors appear on screen for colour wash
  const doorCols={r:[],g:[],b:[]};
  for(let i=0;i<RAYS;i++){
    const ang=player.angle-HFOV+i*RAY_STEP;
    const r=castRay(ang);
    const cd=r.d*Math.cos(ang-player.angle);
    zb[i]=cd;
    const ph=Math.min(H*2.4,(TILE*H)/cd);
    const tp=(H-ph)/2;
    CX.fillStyle=wallColor(r.t,r.mx,r.my,r.side,cd);
    CX.fillRect(i*COL_W,tp,COL_W+0.6,ph);
    // Record door screen columns for bleed effect
    if(r.t===DR) doorCols.r.push({i,cd,ph,tp});
    if(r.t===DG) doorCols.g.push({i,cd,ph,tp});
    if(r.t===DB) doorCols.b.push({i,cd,ph,tp});
  }
  // Colour bleed: draw a soft coloured glow around door columns
  const bleedDoors=[[doorCols.r,[220,40,60]],[doorCols.g,[40,210,90]],[doorCols.b,[50,90,240]]];
  for(const [cols,rgb] of bleedDoors){
    if(!cols.length) continue;
    const minI=Math.max(0,cols[0].i-18), maxI=Math.min(RAYS-1,cols[cols.length-1].i+18);
    const cx2=(minI+maxI)/2*COL_W;
    const avgDist=cols.reduce((s,c)=>s+c.cd,0)/cols.length;
    const bleedFog=Math.max(0,1-avgDist/(MAXD*0.7));
    if(bleedFog<0.05) continue;
    const bleedW=(maxI-minI)*COL_W+60;
    // Floor glow
    const fg=CX.createRadialGradient(cx2,H/2+12,0,cx2,H/2+12,bleedW*0.8);
    fg.addColorStop(0,`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${bleedFog*0.22})`);
    fg.addColorStop(1,'rgba(0,0,0,0)');
    CX.fillStyle=fg; CX.fillRect(cx2-bleedW,H/2,bleedW*2,H/2);
    // Ceiling glow
    const cg2=CX.createRadialGradient(cx2,H/2-12,0,cx2,H/2-12,bleedW*0.8);
    cg2.addColorStop(0,`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${bleedFog*0.15})`);
    cg2.addColorStop(1,'rgba(0,0,0,0)');
    CX.fillStyle=cg2; CX.fillRect(cx2-bleedW,0,bleedW*2,H/2);
  }

  drawPickups(zb);
  drawRobots(zb);
  drawBullets(zb);

  // Crosshair — very dim
  CX.strokeStyle='rgba(0,130,110,0.45)'; CX.lineWidth=1;
  CX.beginPath();
  CX.moveTo(W/2-5,H/2);CX.lineTo(W/2+5,H/2);
  CX.moveTo(W/2,H/2-5);CX.lineTo(W/2,H/2+5);
  CX.stroke();

  // Near-miss flash — brief red vignette at screen edge
  if(nearMissFlash>0){
    const a=nearMissFlash/8*0.35;
    const vg=CX.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.8);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,`rgba(180,20,20,${a})`);
    CX.fillStyle=vg; CX.fillRect(0,0,W,H);
  }
}

// ── Fog-of-war minimap ────────────────────────────────────────
const MMS=160/Math.max(MZW,MZH);
function drawMM(){
  MX.clearRect(0,0,160,160);
  // Background — unexplored = pure black
  MX.fillStyle='#000000';
  MX.fillRect(0,0,160,160);

  for(let y=0;y<MZH;y++) for(let x=0;x<MZW;x++){
    if(!explored[y][x]) continue;
    const c=maze[y][x];
    if(c===WL)      MX.fillStyle='#cccccc';   // walls: bright white-grey
    else if(c===DR) MX.fillStyle='#ff2233';   // red door: vivid
    else if(c===DG) MX.fillStyle='#22ff44';   // green door: vivid
    else if(c===DB) MX.fillStyle='#2244ff';   // blue door: vivid
    else if(c===EX) MX.fillStyle='#ffee22';   // exit: yellow
    else if(c===KR) MX.fillStyle='#ff6677';   // red card: pink
    else if(c===KG) MX.fillStyle='#66ff88';   // green card
    else if(c===KB) MX.fillStyle='#6688ff';   // blue card
    else            MX.fillStyle='#111418';   // floor: very dark, readable
    MX.fillRect(x*MMS, y*MMS, MMS+0.5, MMS+0.5);
  }

  // Robots — bright orange square, always on top
  for(const rb of robots){
    if(!rb.alive) continue;
    const rx=Math.floor(rb.x/TILE), ry=Math.floor(rb.y/TILE);
    if(explored[ry]?.[rx]){
      MX.fillStyle='#ff6600';
      MX.fillRect(rx*MMS+0.5, ry*MMS+0.5, MMS-1, MMS-1);
    }
  }

  // Player — bright cyan dot with direction line
  const px=player.x/TILE*MMS, py=player.y/TILE*MMS;
  MX.fillStyle='#00ffcc';
  MX.fillRect(px-2.5, py-2.5, 5, 5);
  MX.strokeStyle='#00ffcc'; MX.lineWidth=1.5;
  MX.beginPath();
  MX.moveTo(px, py);
  MX.lineTo(px+Math.cos(player.angle)*8, py+Math.sin(player.angle)*8);
  MX.stroke();
}

function updateExplored(){
  // Reveal by casting lightweight rays from player position — fills corridors naturally
  const cx=Math.floor(player.x/TILE), cy=Math.floor(player.y/TILE);
  // Always reveal immediate surroundings
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    const nx=cx+dx,ny=cy+dy;
    if(nx>=0&&nx<MZW&&ny>=0&&ny<MZH) explored[ny][nx]=true;
  }
  // Cast reveal rays across full FOV + a little extra, and also backwards
  const RRAYS=60, RMAXD=TILE*8;
  for(let i=0;i<RRAYS;i++){
    const ang=player.angle - Math.PI*0.6 + (Math.PI*1.2)*(i/RRAYS);
    const ca=Math.cos(ang), sa=Math.sin(ang);
    for(let d=0;d<RMAXD;d+=TILE*0.4){
      const rx=player.x+ca*d, ry=player.y+sa*d;
      const mx=Math.floor(rx/TILE), my=Math.floor(ry/TILE);
      if(mx<0||mx>=MZW||my<0||my>=MZH) break;
      explored[my][mx]=true;
      if(maze[my][mx]===WL) break; // stop at walls
    }
  }
}

// ── Door logic ────────────────────────────────────────────────
function tryDoor(){
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    const wx=player.x+dx*TILE*0.82,wy=player.y+dy*TILE*0.82;
    const mx=Math.floor(wx/TILE),my=Math.floor(wy/TILE);
    if(mx<0||mx>=MZW||my<0||my>=MZH) continue;
    const c=maze[my][mx],k=`${mx},${my}`;
    if(c===DR&&keycards.r&&!doorStates[k]?.open){doorStates[k]={open:true,timer:300};sndDoor();setS('RED DOOR OPENED');return;}
    if(c===DG&&keycards.g&&!doorStates[k]?.open){doorStates[k]={open:true,timer:300};sndDoor();setS('GREEN DOOR OPENED');return;}
    if(c===DB&&keycards.b&&!doorStates[k]?.open){doorStates[k]={open:true,timer:300};sndDoor();setS('BLUE DOOR OPENED');return;}
    if((c===DR||c===DG||c===DB)&&!doorStates[k]?.open) setS('ACCESS DENIED');
  }
}
function updateDoors(){
  for(const k of Object.keys(doorStates)){
    const d=doorStates[k];
    if(d.open){d.timer--;if(d.timer<=0)d.open=false;}
  }
}

// ── Pickups ───────────────────────────────────────────────────
function checkPickups(){
  const mx=Math.floor(player.x/TILE),my=Math.floor(player.y/TILE);
  const c=maze[my][mx];
  if(c===KR&&!keycards.r){keycards.r=true;maze[my][mx]=MT;g('cr').classList.add('got');sndPickup();setS('RED KEYCARD ACQUIRED');}
  if(c===KG&&!keycards.g){keycards.g=true;maze[my][mx]=MT;g('cg').classList.add('got');sndPickup();setS('GREEN KEYCARD ACQUIRED');}
  if(c===KB&&!keycards.b){keycards.b=true;maze[my][mx]=MT;g('cb').classList.add('got');sndPickup();setS('BLUE KEYCARD ACQUIRED');}
  if(c===EX){won=true;showWin();}
}

// ── Robot AI — wander only, shoot on LOS ─────────────────────
function hasLOS(ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,d=Math.sqrt(dx*dx+dy*dy);
  const steps=Math.ceil(d/9);
  for(let i=1;i<steps;i++){
    const t=i/steps,wx=ax+dx*t,wy=ay+dy*t;
    const mx=Math.floor(wx/TILE),my=Math.floor(wy/TILE);
    if(mx<0||mx>=MZW||my<0||my>=MZH) return false;
    const c=maze[my][mx];
    if(c===WL) return false;
    if((c===DR||c===DG||c===DB)&&!doorStates[`${mx},${my}`]?.open) return false;
  }
  return true;
}

function updateRobots(){
  for(const rb of robots){
    if(!rb.alive) continue;
    // Pure random wander
    rb.wTimer--;
    if(rb.wTimer<=0){
      rb.angle+=( Math.random()-.5)*Math.PI*(0.8+Math.random());
      rb.wTimer=35+Math.random()*90;
    }
    const spd=0.75;
    const nx=rb.x+Math.cos(rb.angle)*spd,ny=rb.y+Math.sin(rb.angle)*spd;
    const rmx=Math.floor(nx/TILE),rmy=Math.floor(ny/TILE);
    const passable=rmx>=0&&rmx<MZW&&rmy>=0&&rmy<MZH
      &&maze[rmy][rmx]!==WL&&maze[rmy][rmx]!==DR
      &&maze[rmy][rmx]!==DG&&maze[rmy][rmx]!==DB;
    if(passable){rb.x=nx;rb.y=ny;}
    else{rb.angle+=Math.PI*(0.4+Math.random()*0.6)*(Math.random()>.5?1:-1);rb.wTimer=15;}

    // Shoot if player visible
    rb.sTimer--;
    if(rb.sTimer<=0){
      rb.sTimer=85+Math.random()*55;
      const pdx=player.x-rb.x,pdy=player.y-rb.y;
      const pd=Math.sqrt(pdx*pdx+pdy*pdy);
      if(pd<TILE*7.5&&hasLOS(rb.x,rb.y,player.x,player.y)){
        const spread=(Math.random()-.5)*0.28; // accuracy spread — dodgeable
        const ba=Math.atan2(pdy,pdx)+spread;
        bullets.push({x:rb.x,y:rb.y,vx:Math.cos(ba)*5,vy:Math.sin(ba)*5,life:130});
        sndShot();
      }
    }
  }
}

// ── Bullets ───────────────────────────────────────────────────
let nearMissFlash=0;
function updateBullets(){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(solid(b.x,b.y)||b.life<=0){bullets.splice(i,1);continue;}
    const d=Math.hypot(b.x-player.x,b.y-player.y);
    if(d<PRAD+7){bullets.splice(i,1);killPlayer();return;}
    // Near miss — bullet passed close
    if(d<TILE*0.6) nearMissFlash=8;
  }
  if(nearMissFlash>0) nearMissFlash--;
}

// ── Death / respawn ───────────────────────────────────────────
function killPlayer(){
  if(dead) return;
  dead=true;lives--;sndDeath();updateLives();
  g('df').style.display='block';
  setTimeout(()=>{
    g('df').style.display='none';
    if(lives<=0){showGameOver();return;}
    dead=false;bullets=[];
    // Keycards KEPT — only position resets
    resetPos();setS('UNIT DOWN — RESPAWNING');
  },1700);
}
function resetPos(){player.x=1*TILE+TILE/2;player.y=1*TILE+TILE/2;player.angle=0;}
function updateLives(){for(let i=1;i<=3;i++) g(`l${i}`).classList.toggle('on',i<=lives);}

// ── Overlays ──────────────────────────────────────────────────
function showGameOver(){
  const o=g('ov');
  o.innerHTML=`<h1 style="color:#7a1020;text-shadow:0 0 20px #6a0818">TERMINATED</h1>
  <div class="sub">CONDUIT REJECTED YOU</div><button class="btn" onclick="init()">RETRY SECTOR</button>`;
  o.style.display='flex';running=false;
}
function showWin(){
  const o=g('ov');
  o.innerHTML=`<h1 style="color:#005a50;text-shadow:0 0 20px #004840">THROUGH</h1>
  <div class="sub">CONDUIT BREACHED // SECTOR ZERO CLEAR</div><button class="btn" onclick="init()">NEW SECTOR</button>`;
  o.style.display='flex';running=false;
}

// ── Status ────────────────────────────────────────────────────
function setS(m,d=210){g('sl').textContent=m;statusTimer=d;}
function g(id){return document.getElementById(id);}

// ── Init ──────────────────────────────────────────────────────
function init(){
  getAC();genMaze();
  lives=3;keycards={r:false,g:false,b:false};
  dead=false;won=false;bullets=[];
  ['cr','cg','cb'].forEach(id=>g(id).classList.remove('got'));
  updateLives();resetPos();
  g('ov').style.display='none';
  g('df').style.display='none';
  setS('SECTOR INITIALISED');
  running=true;
  if(!robotLoopId) startRobotAudio();
  lastT=0;
  requestAnimationFrame(loop);
}

// ── Game loop ─────────────────────────────────────────────────
function loop(ts){
  if(!running) return;
  if(lastT===0) lastT=ts;
  const dt=Math.min(1.5,(ts-lastT)/16.67);lastT=ts;
  if(!dead){
    const spd=MSPD*dt;
    // Mobile input
    const mi=window._mobileInput;
    if(mi){
      if(mi.getFwd()) moveP(Math.cos(player.angle)*spd,Math.sin(player.angle)*spd);
      player.angle+=mi.consumeTurn();
    }
    if(keys['KeyW']||keys['ArrowUp'])    moveP(Math.cos(player.angle)*spd,Math.sin(player.angle)*spd);
    if(keys['KeyS']||keys['ArrowDown'])  moveP(-Math.cos(player.angle)*spd*0.7,-Math.sin(player.angle)*spd*0.7);
    if(keys['KeyA']||keys['ArrowLeft'])  player.angle-=RSPD*dt;
    if(keys['KeyD']||keys['ArrowRight']) player.angle+=RSPD*dt;
    checkPickups();
    updateRobots();
    updateBullets();
    updateDoors();
    updateExplored();
  }
  // Robot audio
  let md=999999;
  for(const rb of robots){if(!rb.alive)continue;md=Math.min(md,Math.hypot(rb.x-player.x,rb.y-player.y));}
  setRobotVol(md);

  if(statusTimer>0) statusTimer--;
  else g('sl').textContent='SCANNING...';
  g('cl').textContent=`${Math.floor(player.x/TILE)},${Math.floor(player.y/TILE)}`;

  render();
  drawMM();
  requestAnimationFrame(loop);
}

// ── Input ─────────────────────────────────────────────────────
window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyE') tryDoor();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
g('startbtn').addEventListener('click',init);

// ── Mobile touch controls ─────────────────────────────────────
(function(){
  const indicator=g('look-indicator');
  let lookTouchId=null,lookPrevX=0;
  let fwdTouchId=null,doorTouchId=null;
  // Mobile turn accumulator — applied each frame
  let mobileTurnDelta=0;
  let mobileFwd=false;

  function getTouchTarget(t){
    const el=document.elementFromPoint(t.clientX,t.clientY);
    if(!el) return 'look';
    if(el.id==='fwd-btn'||el.closest('#fwd-btn')) return 'fwd';
    if(el.id==='door-btn'||el.closest('#door-btn')) return 'door';
    return 'look';
  }

  function onTouchStart(e){
    for(const t of e.changedTouches){
      const target=getTouchTarget(t);
      if(target==='fwd'&&fwdTouchId===null){
        fwdTouchId=t.identifier;
        g('fwd-btn').classList.add('held');
      } else if(target==='door'&&doorTouchId===null){
        doorTouchId=t.identifier;
        g('door-btn').classList.add('held');
        tryDoor();
      } else if(target==='look'&&lookTouchId===null){
        lookTouchId=t.identifier;
        lookPrevX=t.clientX;
        const rect=document.getElementById('wrap').getBoundingClientRect();
        indicator.style.left=(t.clientX-rect.left)+'px';
        indicator.style.top=(t.clientY-rect.top)+'px';
        indicator.classList.add('active');
      }
    }
    e.preventDefault();
  }

  function onTouchMove(e){
    for(const t of e.changedTouches){
      if(t.identifier===lookTouchId){
        const dx=t.clientX-lookPrevX;
        mobileTurnDelta+=dx*0.006;
        lookPrevX=t.clientX;
        // Move indicator
        const rect=document.getElementById('wrap').getBoundingClientRect();
        indicator.style.left=(t.clientX-rect.left)+'px';
        indicator.style.top=(t.clientY-rect.top)+'px';
      }
    }
    e.preventDefault();
  }

  function onTouchEnd(e){
    for(const t of e.changedTouches){
      if(t.identifier===lookTouchId){lookTouchId=null;indicator.classList.remove('active');}
      if(t.identifier===fwdTouchId){fwdTouchId=null;g('fwd-btn').classList.remove('held');}
      if(t.identifier===doorTouchId){doorTouchId=null;g('door-btn').classList.remove('held');}
    }
  }

  // Expose to game loop
  window._mobileInput={
    getFwd:()=>fwdTouchId!==null,
    consumeTurn:()=>{const d=mobileTurnDelta;mobileTurnDelta=0;return d;}
  };

  const wrap=document.getElementById('wrap');
  wrap.addEventListener('touchstart',onTouchStart,{passive:false});
  wrap.addEventListener('touchmove',onTouchMove,{passive:false});
  wrap.addEventListener('touchend',onTouchEnd,{passive:false});
  wrap.addEventListener('touchcancel',onTouchEnd,{passive:false});
})();
</script>
